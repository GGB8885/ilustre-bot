<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>

  <div class="container">

    <div class="header">
      <div class="logo">
        <div class="circle"></div>
        <div>
          <h1>Echo</h1>
          <p>Asistente oficial de VENN</p>
        </div>
      </div>
    </div>

    <div id="chat">
      <div class="ai">
        Hola 👋
        <br><br>
        Soy <b>Echo</b>.
        <br><br>
        Estoy aquí para ayudarte a descubrir contenido, responder preguntas y acompañarte dentro de VENN.
        <br><br>
        ¿En qué puedo ayudarte?
      </div>
    </div>

    <form class="bottom" id="chat-form">
      <input 
        id="message" 
        type="text" 
        placeholder="Escribe un mensaje..."
        autocomplete="off"
      >
      <button id="send" type="submit" aria-label="Enviar mensaje">
        ➜
      </button>
    </form>

  </div>

  <script src="script.js"></script>
</body>

</html>
